name: Build Mac preview (explicit label only)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.label.name == 'build-macos-preview' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_TAG: v0.3.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify public repo and existing draft destination
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(gh api "repos/$GH_REPO" --jq .visibility)" = public
          test "$(gh release view "$PREVIEW_TAG" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$PREVIEW_TAG" --json targetCommitish --jq .targetCommitish)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and verify standalone app
        env:
          GH_TOKEN: ''
        run: sh scripts/build-macos.sh
      - name: Attach to draft only (no Actions artifact storage)
        run: |
          test "$(gh release view "$PREVIEW_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$PREVIEW_TAG" dist/fest-0.3.0-darwin-*.tar.gz*
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            gh release upload "$PREVIEW_TAG" scripts/install.sh
          fi
